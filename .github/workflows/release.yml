name: Release-ZIP

# Von Hand entsteht nur ein Build-Artefakt. Ein Tag vX.Y.Z legt einen Entwurf an,
# den ein Mensch erst nach dem Testlauf im Browser veröffentlicht.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    name: ZIP bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node tests/statisch.mjs
      - run: node tests/kataloge.mjs
      - run: node tests/release.mjs
      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          version=$(sed -E 's/.*"([^"]+)".*/\1/' app/version.js)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu app/version.js ($version)."
            exit 1
          fi
          echo "datei=r42j-v$version.zip" >> "$GITHUB_OUTPUT"
      - run: node tools/release-zip.mjs "${{ steps.version.outputs.datei }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.datei }}
          path: ${{ steps.version.outputs.datei }}
          if-no-files-found: error
      - name: Release-Entwurf anlegen
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATEI: ${{ steps.version.outputs.datei }}
        run: gh release create "$GITHUB_REF_NAME" "$DATEI" --repo "$GITHUB_REPOSITORY" --draft --generate-notes
