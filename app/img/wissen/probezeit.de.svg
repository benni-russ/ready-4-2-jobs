<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="720" height="190" rx="0" fill="#ffffff" stroke="none"/><rect x="30" y="90" width="330" height="22" rx="4" fill="#dfe9f7" stroke="none"/><rect x="360" y="90" width="330" height="22" rx="4" fill="#eaeef3" stroke="none"/><path d="M360 74 L360 128" stroke="#2456a6" stroke-width="2"/><text x="360" y="64" font-size="15" font-weight="600" fill="#2456a6" text-anchor="middle">6 Monate</text><text x="195" y="144" font-size="14" font-weight="400" fill="#17202b" text-anchor="middle">Bis zu sechs Monate:</text><text x="195" y="165" font-size="14" font-weight="400" fill="#17202b" text-anchor="middle">meist zwei Wochen Frist</text><text x="525" y="144" font-size="14" font-weight="400" fill="#17202b" text-anchor="middle">Danach: längere Frist, in Betrieben mit</text><text x="525" y="165" font-size="14" font-weight="400" fill="#17202b" text-anchor="middle">mehr als zehn Beschäftigten Kündigungsschutz</text></svg>
